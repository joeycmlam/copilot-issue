[tool.poetry]
name = "copilot-issue-api-v2"
version = "0.2.0"
description = "FastAPI service that creates GitHub Issues and assigns them to the Copilot coding agent, with org-level reusable custom agents, skills and tools."
authors = ["Solutions Architect <architect@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
httpx = "^0.27"
pydantic = "^2.9"
pydantic-settings = "^2.6"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
respx = "^0.21"

[build-system]
requires = ["poetry-core>=1.6"]
build-backend = "poetry.core.masonry.api"
